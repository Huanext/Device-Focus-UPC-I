},"80101658":{"NOTE 60 PRO 5G":[0,1,12999,0]},"80101679":{"NOTE EDGE 5G":[0,1,7499,0]},"80101692":{"SMART 20 4G":[0,1,3999,3]},"80101696":{"SMART 20 4G":[0,1,1549,4]},"80101697":{"HOT 70 4G":[0,1,5799,0],"SMART 20 4G":[0,2,5298,0]},"80101698":{"SMART 20 4G":[0,1,3999,2]},"80101699":{"HOT 70 4G":[0,1,3499,0],"SMART 20 4G":[0,2,5548,1]},"80101701":{"SMART 20 4G":[0,1,3599,0]},"80101702":{"SMART 20 4G":[0,1,3999,0]},"80101703":{"SMART 20 4G":[0,1,3599,1]},"80101704":{"SMART 20 4G":[0,2,7198,2]},"80101705":{"SMART 20 4G":[0,1,999,2]},"80101707":{"SMART 20 4G":[0,1,999,1]},"80101710":{"SMART 20 4G":[0,1,1399,2]},"80101711":{"HOT 70 4G":[0,1,5399,0],"SMART 20 4G":[0,0,0,3]},"80101712":{"GT 50 PRO 5G":[0,1,10799,0],"SMART 20 4G":[0,0,0,2]},"20999999":{"HOT 30 5G":[0,0,0,2]},"80002414":{"GT 50 PRO 5G":[0,0,0,1],"NOTE EDGE 5G":[0,0,0,18]},"80017004":{"SMART 20 4G":[0,0,0,2]},"80017047":{"SMART 20 4G":[0,0,0,2]},"80017091":{"SMART 20 4G":[0,0,0,2]},"80017205":{"SMART 20 4G":[0,0,0,2]},"80100626":{"GT 50 PRO 5G":[0,0,0,2],"HOT 70 4G":[0,0,0,5],"NOTE 60 PRO 5G":[0,0,0,3],"NOTE EDGE 5G":[0,0,0,1],"SMART 20 4G":[0,0,0,9]},"80100837":{"GT 50 PRO 5G":[0,0,0,1],"HOT 70 4G":[0,0,0,4],"NOTE 60 PRO 5G":[0,0,0,2],"NOTE EDGE 5G":[0,0,0,2],"SMART 20 4G":[0,0,0,12]},"80100859":{"SMART 20 4G":[0,0,0,4]},"80101180":{"SMART 20 4G":[0,0,0,1]},"80101214":{"HOT 70 4G":[0,0,0,4],"NOTE 60 PRO 5G":[0,0,0,2],"NOTE EDGE 5G":[0,0,0,2],"SMART 20 4G":[0,0,0,4]},"80101269":{"NOTE 60 PRO 5G":[0,0,0,1],"SMART 20 4G":[0,0,0,2]},"80101348":{"SMART 20 4G":[0,0,0,1]},"80101628":{"GT 50 PRO 5G":[0,0,0,2],"HOT 70 4G":[0,0,0,4],"NOTE EDGE 5G":[0,0,0,2],"SMART 20 4G":[0,0,0,7]},"80101669":{"HOT 70 4G":[0,0,0,2],"SMART 20 4G":[0,0,0,4]},"80101691":{"SMART 20 4G":[0,0,0,2]},"80101693":{"SMART 20 4G":[0,0,0,2]},"80101695":{"SMART 20 4G":[0,0,0,3]},"80101700":{"SMART 20 4G":[0,0,0,3]},"80101706":{"SMART 20 4G":[0,0,0,3]},"80101708":{"SMART 20 4G":[0,0,0,2]},"80101709":{"SMART 20 4G":[0,0,0,3]},"80101713":{"SMART 20 4G <script>
const D=JSON.parse(document.getElementById('data').textContent);
const G=D.groups, ACC=['#4A6CF7','#F2B705','#3BB4F2','#1BA466','#9B59B6','#E67E22'], PACE=D.day/D.dim;
const st={zone:'UPC I',area:'',view:'area',grp:'',q:'',sort:null,dir:-1};
try{const s=JSON.parse(localStorage.getItem('df_state')||'{}');Object.assign(st,s);st.q='';st.sort=null}catch(e){}
const save=()=>{try{localStorage.setItem('df_state',JSON.stringify({zone:st.zone,area:st.area,view:st.view,grp:st.grp}))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>x?Math.round(x).toLocaleString('en-US'):'-';
const f1=x=>!x?'-':(x>=10?Math.round(x).toLocaleString('en-US'):x.toFixed(1));
const sh=g=>g.replace(/ 4G$/,'');
const ar=a=>a.replace('UPC - ','');
const cls=p=>p>=PACE?'g':(p>=PACE*.8?'y':'r');
const col=p=>p>=PACE?'#1BA466':(p>=PACE*.8?'#F2B705':'#E05252');
const pc=(a,T)=>{if(!T)return'<td class="pc c">-</td>';const p=a/T;return`<td class="pc"><div class="pw ${cls(p)}"><i style="width:${Math.min(p,1)*100}%"></i><span>${Math.round(p*100)}%</span><b style="left:${PACE*100}%"></b></div></td>`};
const cover=(sk,mq)=>{if(!mq)return'<td class="n cv">-</td>';const d=sk/(mq/D.day);return`<td class="n cv ${d<7?'r':d<14?'y':'g'}">${Math.round(d).toLocaleString('en-US')}</td>`};

function vec(list){
  const v=G.map(()=>({tq:0,tn:0,mq:0,mn:0,T:0,TN:0,sk:0}));
  for(const s of list){const c=s[0],a=D.F[c],t=D.T[c],k=D.S[c];
    G.forEach((_,i)=>{const d=v[i];if(a&&a[i]){d.tq+=a[i][0];d.tn+=a[i][1];d.mq+=a[i][2];d.mn+=a[i][3]}
      if(t&&t[i]){d.T+=t[i][0];d.TN+=t[i][1]}if(k)d.sk+=k[i]||0})}
  const tot={};['tq','tn','mq','mn','T','TN','sk'].forEach(k=>tot[k]=v.reduce((s,d)=>s+d[k],0));v.push(tot);return v}

const zoneOf=()=>D.shops.filter(s=>st.zone==='ALL'||s[3]===st.zone);
const scope=()=>zoneOf().filter(s=>!st.area||s[2]===st.area);
const zones=[...new Set(D.shops.map(s=>s[3]))].sort((a,b)=>(a==='UPC I'?0:a.startsWith('UPC')?1:2)-(b==='UPC I'?0:b.startsWith('UPC')?1:2)||a.localeCompare(b));

function renderMeta(){
  document.getElementById('meta').innerHTML=`Data As of <b>${esc(D.asof)}</b> · ดึงข้อมูล <b>${esc(D.pulled)}</b>${D.stock_time?` · Stock <b>${esc(D.stock_time)}</b>`:''}<br>
  <span class="daybar">วันที่ ${D.day}/${D.dim} ของเดือน <span class="trk"><i style="width:${PACE*100}%"></i></span> <b>${Math.round(PACE*100)}%</b></span>`;
  document.getElementById('zones').innerHTML=[...zones,'ALL'].map(z=>`<button class="chip${st.zone===z?' on':''}" data-z="${esc(z)}">${z==='ALL'?'ทุกภาค':esc(z)}</button>`).join('');
  const areas=[...new Set(zoneOf().map(s=>s[2]))].sort();
  if(st.area&&!areas.includes(st.area))st.area='';
  document.getElementById('area').innerHTML=`<option value="">ทุกเขต (${areas.length})</option>`+areas.map(a=>`<option${a===st.area?' selected':''} value="${esc(a)}">${esc(ar(a))}</option>`).join('');
  document.getElementById('grp').innerHTML=`<option value="">ทุกกลุ่ม (สรุป)</option>`+G.map((g,i)=>`<option value="${i}"${String(i)===st.grp?' selected':''}>${esc(g)}</option>`).join('');
  document.getElementById('ttl').textContent='Device Focus · '+(st.area?ar(st.area):(st.zone==='ALL'?'ทุกภาค':st.zone));
}

function renderTiles(){
  const v=vec(scope()),t=v[v.length-1];
  let h=`<div class="tile main${st.grp===''?' sel':''}" data-g=""><div class="tl">รวม DEVICE FOCUS</div><div class="tv">${fmt(t.mq)} <small>/ ${fmt(t.T)} เครื่อง</small></div>
   <div class="ts">${t.T?Math.round(t.mq/t.T*100)+'%':'-'} · วันนี้ ${fmt(t.tq)} / ${f1(t.T/D.dim)}</div><div class="pbar"><i style="width:${t.T?Math.min(t.mq/t.T,1)*100:0}%;background:#fff"></i><b style="left:${PACE*100}%"></b></div>
   <div class="stk">${fmt(t.mn)} / ${fmt(t.TN)} บาท (${t.TN?Math.round(t.mn/t.TN*100)+'%':'-'}) · Stock ${fmt(t.sk)}</div></div>`;
  G.forEach((g,i)=>{const d=v[i],p=d.T?d.mq/d.T:0;
    h+=`<div class="tile${st.grp===String(i)?' sel':''}" data-g="${i}" style="--acc:${ACC[i%ACC.length]}"><div class="tl">${esc(g)}</div>
    <div class="tv">${fmt(d.mq)} <small>/ ${fmt(d.T)}</small></div><div class="ts">${d.T?Math.round(p*100)+'%':'-'} · วันนี้ ${fmt(d.tq)} / ${f1(d.T/D.dim)}</div>
    <div class="pbar"><i style="width:${Math.min(p,1)*100}%;background:${col(p)}"></i><b style="left:${PACE*100}%"></b></div><div class="stk">Stock ${fmt(d.sk)}</div></div>`});
  const te=document.getElementById('tiles');te.style.setProperty('--n',G.length);te.innerHTML=h;
}

// ---- columns: [header, sortValue(v), cell(v)]
function cols(){
  if(st.grp===''){
    const c=[];G.forEach((g,i)=>{c.push([`${esc(sh(g))}<br><small>MTD/Target</small>`,v=>v[i].mq,v=>`<td class="n">${fmt(v[i].mq)}<span style="color:#999"> / ${fmt(v[i].T)}</span></td>`,ACC[i%ACC.length]]);
      c.push(['%Ach',v=>v[i].T?v[i].mq/v[i].T:-1,v=>pc(v[i].mq,v[i].T),ACC[i%ACC.length]])});
    const L=G.length;
    c.push(['วันนี้<br><small>ขาย / TG</small>',v=>v[L].tq,v=>`<td class="n${v[L].T&&v[L].tq>=v[L].T/D.dim?' hit':''}">${fmt(v[L].tq)} <span style="color:#999">/ ${f1(v[L].T/D.dim)}</span></td>`]);
    c.push(['รวม MTD<br><small>เครื่อง</small>',v=>v[L].mq,v=>`<td class="n b">${fmt(v[L].mq)}</td>`]);
    c.push(['Target<br><small>เครื่อง</small>',v=>v[L].T,v=>`<td class="n tg">${fmt(v[L].T)}</td>`]);
    c.push(['%Ach<br><small>เครื่อง</small>',v=>v[L].T?v[L].mq/v[L].T:-1,v=>pc(v[L].mq,v[L].T)]);
    c.push(['MTD<br><small>บาท</small>',v=>v[L].mn,v=>`<td class="n b">${fmt(v[L].mn)}</td>`]);
    c.push(['%Ach<br><small>บาท</small>',v=>v[L].TN?v[L].mn/v[L].TN:-1,v=>pc(v[L].mn,v[L].TN)]);
    c.push(['Stock',v=>v[L].sk,v=>`<td class="n sk">${fmt(v[L].sk)}</td>`]);
    return c}
  const i=+st.grp;
  return[['วันนี้<br><small>Target</small>',v=>v[i].T,v=>`<td class="n tg">${f1(v[i].T/D.dim)}</td>`],
   ['วันนี้<br><small>ขาย</small>',v=>v[i].tq,v=>`<td class="n${v[i].T&&v[i].tq>=v[i].T/D.dim?' hit':''}">${fmt(v[i].tq)}</td>`],
   ['Target<br><small>เดือน</small>',v=>v[i].T,v=>`<td class="n tg">${fmt(v[i].T)}</td>`],
   ['MTD<br><small>เครื่อง</small>',v=>v[i].mq,v=>`<td class="n b">${fmt(v[i].mq)}</td>`],
   ['%Ach',v=>v[i].T?v[i].mq/v[i].T:-1,v=>pc(v[i].mq,v[i].T)],
   ['ขาด<br><small>ถึงเป้า</small>',v=>v[i].T-v[i].mq,v=>`<td class="n">${v[i].T>v[i].mq?fmt(v[i].T-v[i].mq):'<span style="color:#1BA466">ถึงแล้ว</span>'}</td>`],
   ['MTD<br><small>บาท</small>',v=>v[i].mn,v=>`<td class="n">${fmt(v[i].mn)}</td>`],
   ['Stock',v=>v[i].sk,v=>`<td class="n sk">${fmt(v[i].sk)}</td>`],
   ['Stock พอขาย<br><small>(วัน)</small>',v=>v[i].mq?v[i].sk/(v[i].mq/D.day):1e9,v=>cover(v[i].sk,v[i].mq)]]
}
const defSort=()=>{const c=cols();return st.grp===''?c.length-4:4};

function table(first,rows,sumRow){
  const c=cols(),si=st.sort??defSort();
  rows.forEach(r=>r.k=c[si][1](r.v));rows.sort((a,b)=>(a.k-b.k)*st.dir);
  let h='<table><thead><tr>'+first.map((f,j)=>`<th${j===1?' class="st"':''}>${f}</th>`).join('')+c.map((x,j)=>`<th class="s gh" data-s="${j}" style="--acc:${x[3]||'transparent'}">${x[0]}${j===si?(st.dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach((r,n)=>{h+=`<tr class="${r.v[G.length].mq?'':'zero'}"><td class="c">${n+1}</td>${r.cells}${c.map(x=>x[2](r.v)).join('')}</tr>`});
  if(sumRow)h+=`<tr class="sum"><td></td>${sumRow.cells}${c.map(x=>x[2](sumRow.v)).join('')}</tr>`;
  return h+'</tbody></table>'}

function renderArea(){
  const sc=scope(),by={};sc.forEach(s=>(by[s[2]]=by[s[2]]||[]).push(s));
  const multiZone=st.zone==='ALL';
  const rows=Object.entries(by).map(([a,l])=>({v:vec(l),cells:`<td class="st"><b>${esc(ar(a))}</b>${multiZone?`<div style="font-size:11.5px;color:#888">${esc(l[0][3])}</div>`:''}</td><td class="n c">${l.length}</td>`}));
  if(!rows.length)return'<div class="empty">ไม่มีข้อมูล</div>';
  return table(['#','เขต','สาขา'],rows,{v:vec(sc),cells:`<td class="st">รวม ${rows.length} เขต</td><td class="n">${sc.length}</td>`})}

function renderShop(){
  const q=st.q.trim().toLowerCase();
  let sc=scope();if(q)sc=sc.filter(s=>(s[0]+' '+s[1]+' '+s[4]+' '+s[2]).toLowerCase().includes(q));
  const rows=sc.map(s=>({v:vec([s]),cells:`<td class="st"><b>${esc(s[1])}</b><div style="font-size:11.5px;color:#888">${esc(s[0])} · ${esc(ar(s[2]))}</div></td><td>${esc(s[4]||'-')}</td>`}));
  if(!rows.length)return'<div class="empty">ไม่พบสาขา</div>';
  return table(['#','สาขา','FRM'],rows,{v:vec(sc),cells:`<td class="st">รวม ${sc.length} สาขา</td><td></td>`})}

function renderModel(){
  const sc=scope(),idx=st.grp===''?G.map((_,i)=>i):[+st.grp];
  let h='<table><thead><tr><th>#</th><th class="st">กลุ่ม / รุ่น</th><th>วันนี้<br><small>ขาย</small></th><th>MTD<br><small>เครื่อง</small></th><th>MTD<br><small>บาท</small></th><th>ราคาเฉลี่ย<br><small>บาท/เครื่อง</small></th><th>Stock</th><th>Stock พอขาย<br><small>(วัน)</small></th></tr></thead><tbody>';
  let any=false;
  idx.forEach(i=>{const g=G[i],mm={},m=D.M[g]||{};
    sc.forEach(s=>{const d=m[s[0]];if(!d)return;for(const[md,x]of Object.entries(d)){const a=mm[md]=mm[md]||[0,0,0,0];x.forEach((y,k)=>a[k]+=y)}});
    const ent=Object.entries(mm).sort((a,b)=>b[1][1]-a[1][1]||b[1][3]-a[1][3]);if(!ent.length)return;any=true;
    const t=[0,0,0,0];ent.forEach(e=>e[1].forEach((y,k)=>t[k]+=y));
    h+=`<tr class="sub"><td></td><td class="st" style="box-shadow:inset 5px 0 0 ${ACC[i%ACC.length]}">${esc(g)} <span style="font-weight:400;color:#888">(${ent.length} รุ่น)</span></td><td class="n">${fmt(t[0])}</td><td class="n">${fmt(t[1])}</td><td class="n">${fmt(t[2])}</td><td class="n">${t[1]?fmt(t[2]/t[1]):'-'}</td><td class="n sk">${fmt(t[3])}</td>${cover(t[3],t[1])}</tr>`;
    ent.forEach(([md,x],n)=>{h+=`<tr class="${x[1]?'':'zero'}"><td class="c">${n+1}</td><td class="st">${esc(md)}</td><td class="n">${fmt(x[0])}</td><td class="n b">${fmt(x[1])}</td><td class="n">${fmt(x[2])}</td><td class="n">${x[1]?fmt(x[2]/x[1]):'-'}</td><td class="n sk">${fmt(x[3])}</td>${cover(x[3],x[1])}</tr>`})});
  return any?h+'</tbody></table>':'<div class="empty">ไม่มีข้อมูลรายรุ่น</div>'}

function render(){
  renderMeta();renderTiles();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===st.view));
  document.getElementById('q').style.display=st.view==='shop'?'':'none';
  document.getElementById('tw').innerHTML=st.view==='area'?renderArea():st.view==='shop'?renderShop():renderModel();
  document.getElementById('foot').innerHTML=`HANDSET เท่านั้น · ไม่รวม CreditNote · Stock ไม่รวมเครื่อง Demo · Target วันนี้ = Target เดือน ÷ ${D.dim} วัน · ตัวเลขสีเขียว = ขายวันนี้ถึง Target วันนี้<br>
  %Ach: <i style="background:#1BA466"></i>≥ เวลาที่ผ่านไป (${Math.round(PACE*100)}%)<i style="background:#F2B705"></i>ใกล้ถึง<i style="background:#E05252"></i>ต่ำกว่าเป้า · เส้นดำ = เวลาที่ผ่านไปของเดือน · Stock พอขาย (วัน) = Stock ÷ ยอดขายเฉลี่ยต่อวันของเดือนนี้ · คลิกหัวคอลัมน์เพื่อเรียง`;
  save()}

document.getElementById('zones').onclick=e=>{const b=e.target.closest('[data-z]');if(!b)return;st.zone=b.dataset.z;st.area='';render()};
document.getElementById('area').onchange=e=>{st.area=e.target.value;render()};
document.getElementById('grp').onchange=e=>{st.grp=e.target.value;st.sort=null;st.dir=-1;render()};
document.getElementById('tiles').onclick=e=>{const t=e.target.closest('[data-g]');if(!t)return;st.grp=t.dataset.g;st.sort=null;st.dir=-1;render()};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;st.view=b.dataset.v;st.sort=null;st.dir=-1;render()};
document.getElementById('q').oninput=e=>{st.q=e.target.value;document.getElementById('tw').innerHTML=renderShop()};
document.getElementById('tw').onclick=e=>{const h=e.target.closest('th[data-s]');if(!h)return;const j=+h.dataset.s;if((st.sort??defSort())===j)st.dir=-st.dir;else{st.sort=j;st.dir=-1}
  document.getElementById('tw').innerHTML=st.view==='area'?renderArea():renderShop()};
render();
</script></body></html>
